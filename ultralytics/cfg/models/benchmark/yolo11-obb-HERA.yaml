# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 Oriented Bounding Boxes (OBB) model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/obb


# Parameters
nc: 3 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-obb.yaml' will call yolo11-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # summary: 344 layers, 9744931 parameters, 9744915 gradients, 22.7 GFLOPs

ch: 6
imgsz: 256
# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]                         # 0
  - [0, 1, MSDE_OPT, []]                       # 1 OPT images
  - [0, 1, MSDE_SAR, []]                          # 2 SAR images

  # RGB and SAR backbone
  # GPT Fusion one
  - [1, 1, Conv, [64, 3, 2]]                     # 3-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 4-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 5
  - [-1, 1, Conv, [256, 3, 2]]                   # 6-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 7

  - [2, 1, Conv, [64, 3, 2]]                     # 8-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 9-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 10
  - [-1, 1, Conv, [256, 3, 2]]                   # 11-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 12

  - [[7, 12], 1, CMIM, [256, 16]]  # 13 [channel, sra, h, w, number]
  - [[7, 13], 1, Add_GPT, [256, 0]]              # 14-P3 stream one:x + trans[0]
  - [[12, 13], 1, Add_GPT, [256, 1]]             # 15-P3 stream two:x + trans[1]
  - [[14, 15], 1, RDLCI, [256, "P3"]]            # 16 P3局部交互 dim=256
  - [16, 1, GetItem, [256, 0]]                        # 17 P3 RGB增强分支（P4下采样输入）
  - [16, 1, GetItem, [256, 1]]                        # 18 P3 SAR增强分支（P4下采样输入）

  # GPT Fusion two P4 【修正：输入从14/15 → 17/18】
  - [17, 1, Conv, [512, 3, 2]]                   # 19-P4/16 输入P3增强RGB#17
  - [-1, 2, C3k2, [512, True]]                   # 20

  - [18, 1, Conv, [512, 3, 2]]                   # 21-P4/16 输入P3增强SAR#18
  - [-1, 2, C3k2, [512, True]]                   # 22

  - [[20, 22], 1, CMIM, [256, 16]] # 23 P4全局Mamba
  - [[20, 23], 1, Add_GPT, [512, 0]]             # 24-P4 stream one:x + trans[0]
  - [[22, 23], 1, Add_GPT, [512, 1]]             # 25-P4 stream two:x + trans[1]
  - [[24, 25], 1, RDLCI, [256, "P4"]]            # 26 P4局部交互 dim=256（匹配AFM通道）
  - [26, 1, GetItem, [256, 0]]                        # 27 P4 RGB增强分支（P5下采样输入）
  - [26, 1, GetItem, [256, 1]]                        # 28 P4 SAR增强分支（P5下采样输入）

  # GPT Fusion three P5 【修正：输入从24/25 → 27/28】
  - [27, 1, Conv, [1024, 3, 2]]                  # 29-P5/32 输入P4增强RGB#27
  - [-1, 2, C3k2, [1024, True]]                  # 30
  - [-1, 1, SPPF, [1024, 5]]                     # 31

  - [28, 1, Conv, [1024, 3, 2]]                  # 32-P5/32 输入P4增强SAR#28
  - [-1, 2, C3k2, [1024, True]]                  # 33
  - [-1, 1, SPPF, [1024, 5]]                     # 34

  - [[31, 34], 1, CMIM, [512, 32]] # 35 P5全局Mamba
  - [[31, 35], 1, Add_GPT, [1024, 0]]            # 36-P5 stream one:x + trans[0]
  - [[34, 35], 1, Add_GPT, [1024, 1]]            # 37-P5 stream two:x + trans[1]
  - [[36, 37], 1, RDLCI, [512, "P5"]]            # 38 P5局部交互 dim=512（匹配AFM通道）
  - [38, 1, GetItem, [512, 0]]                        # 39 P5 RGB增强分支
  - [38, 1, GetItem, [512, 1]]                        # 40 P5 SAR增强分支

  # Add Block AFM（输入全部取自HBCMI拆分后的增强分支）
  - [[17, 18], 1, AFM, [256]]                   # 41-P3/8  fusion backbone P3
  - [[27, 28], 1, AFM, [256]]                   # 42-P4/16 fusion backbone P4
  - [[39, 40], 1, AFM, [512]]                   # 43-P5/32 fusion backbone P5
  - [-1, 2, C2PSA, [1024]]                       # 44

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 45
  - [[-1, 42], 1, Concat, [1]]                   # 46 cat backbone P4 AFM(42)
  - [-1, 2, C3k2, [512, False]]                  # 47

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 48
  - [[-1, 41], 1, Concat, [1]]                   # 49 cat backbone P3 AFM(41)
  - [-1, 2, C3k2, [256, False]]                  # 50 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 51
  - [[-1, 47], 1, Concat, [1]]                   # 52 cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 53 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 54
  - [[-1, 44], 1, Concat, [1]]                   # 55 cat head P5 C2PSA(44)
  - [-1, 2, C3k2, [1024, True]]                  # 56 (P5/32-large)

  - [[50, 53, 56], 1, OBB, [nc, 1]]              # Detect (P3, P4, P5)
